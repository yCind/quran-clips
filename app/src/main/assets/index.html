  sec("play","جودات التصدير",`<div class="chips">${QS.map(q=>`<button class="chip ${S.qs.includes(q[0])?"sel":""}" data-q="${q[0]}" onclick="tq(${q[0]})">${q[1]}</button>`).join("")}</div><p class="note">يمكن اختيار أكثر من جودة. الجودة العالية تحتاج وقتًا أطول.</p>`)+
  sec("","الملخص",`<p class="note" style="margin:0">سورة ${SUR[S.surah-1].a}، الآيات ${AR(S.from)} إلى ${AR(S.to)}${S.rep>1?` (كل آية ${AR(S.rep)} مرات)`:""}<br>القارئ: ${recName(S.rec)}<br>الخلفية: ${BGT[S.bgType]} · ${FM[S.fmt][2]}<br>الخط: ${FONTS[S.font][1]} · الإطار: ${FRM[S.frm]}${S.wave?"<br>موجة الصوت: "+WAVE[S.wave]:""}</p>`);
  nav(back,`<button class="pri" onclick="gen()">ابدأ الإنشاء</button>`)}
 save()}
function go(d){S.step+=d;const o=$("out");render();o.className=d>0?"n":"b";clearTimeout(go.t);go.t=setTimeout(()=>{o.className=""},700);scrollTo(0,0)}
function jump(s){S.step=s;const o=$("out");render();o.className="b";clearTimeout(go.t);go.t=setTimeout(()=>{o.className=""},700);scrollTo(0,0)}
function drop(){(S.outs||[]).forEach(x=>URL.revokeObjectURL(x.url));S.outs=null;S.note=null}
function again(){drop();jump(0)}
function edit(){drop();jump(5)}
function prev(i){S.cur=i;const rv=$("rv");rv.src=S.outs[i].url;rv.load();sel("[data-c]",b=>+b.dataset.c==i)}
window.goBack=()=>{if(S.run)return true;if(S.step==6&&S.outs){edit();return true}if(S.step>0){go(-1);return true}return false};
/* ---------- الإنشاء ---------- */
function cleanAyah(a){let w=a.text.split(" ");if(S.surah!=1&&a.numberInSurah==1&&w.length>4&&norm(w[0])=="بسم")w=w.slice(4);return w.join(" ")}
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>rej(new Error("تعذّر تحميل مكتبة الترميز"));document.head.appendChild(s)})}
async function loadMuxer(){if(window.Mp4Muxer)return;let last;for(const v of ["5.2.1","5.1.3"]){try{await loadScript(`https://cdn.jsdelivr.net/npm/mp4-muxer@${v}/build/mp4-muxer.js`);if(window.Mp4Muxer)return}catch(e){last=e}}throw last||new Error("muxer")}
async function pickCodec(w,hh,br){const l=w*hh<=921600?["avc1.64001f","avc1.42001f","avc1.64002a"]:["avc1.640028","avc1.64002a","avc1.640034"];for(const cd of l){try{const r=await VideoEncoder.isConfigSupported({codec:cd,width:w,height:hh,bitrate:br,framerate:30});if(r.supported)return cd}catch(e){}}return null}
function buildMix(segs,bufs,sr,total){const n=Math.ceil(total*sr),L=new Float32Array(n),R=new Float32Array(n);
 segs.forEach(s=>{if(s.intro)return;const b=bufs[s.b],o=Math.round(s.s*sr),a=b.getChannelData(0),a2=b.numberOfChannels>1?b.getChannelData(1):a;for(let i=0;i<a.length&&o+i<n;i++){L[o+i]+=a[i];R[o+i]+=a2[i]}});return{L,R,n}}
async function encodeOffline(P){
 const{W,H,segs,total,mix,ac,msg,pg}=P,fps=30,sr=ac.sampleRate,n=mix.n;
 msg("تجهيز المُرمِّز…");await loadMuxer();
 const sa=await AudioEncoder.isConfigSupported({codec:"mp4a.40.2",sampleRate:sr,numberOfChannels:2,bitrate:128000});if(!sa.supported)throw new Error("ترميز AAC غير مدعوم");
 const qs=[...S.qs].sort((a,b)=>b-a),outs=[];
 for(const q of qs){const[w,hh]=dims(q,S.fmt),br=QS.find(z=>z[0]==q)[2],cd=await pickCodec(w,hh,br);if(!cd)throw new Error("ترميز H.264 غير مدعوم عند "+q+"p");outs.push({q,w,h:hh,br,cd})}
 let err=null;const aq=[];
 const ae=new AudioEncoder({output:(c,m)=>aq.push([c,m]),error:e=>{err=e}});ae.configure({codec:"mp4a.40.2",sampleRate:sr,numberOfChannels:2,bitrate:128000});
 for(let o=0;o<n;o+=8192){const m=Math.min(8192,n-o),d=new Float32Array(m*2);d.set(mix.L.subarray(o,o+m),0);d.set(mix.R.subarray(o,o+m),m);const ad=new AudioData({format:"f32-planar",sampleRate:sr,numberOfFrames:m,numberOfChannels:2,timestamp:Math.round(o/sr*1e6),data:d});ae.encode(ad);ad.close();if(ae.encodeQueueSize>8)await sleep(1)}
 await ae.flush();ae.close();if(err)throw err;
 outs.forEach(o=>{o.mx=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:"avc",width:o.w,height:o.h},audio:{codec:"aac",numberOfChannels:2,sampleRate:sr},fastStart:"in-memory",firstTimestampBehavior:"offset"});
  aq.forEach(([c,m])=>o.mx.addAudioChunk(c,m));
  o.ve=new VideoEncoder({output:(c,m)=>o.mx.addVideoChunk(c,m),error:e=>{err=e}});o.ve.configure({codec:o.cd,width:o.w,height:o.h,bitrate:o.br,framerate:fps});
  o.cv=document.createElement("canvas");o.cv.width=o.w;o.cv.height=o.h;o.c=o.cv.getContext("2d")});
 const M=outs[0],k=M.q/720,N=Math.ceil(total*fps);PREV=[];
 for(let i=0;i<N;i++){const t=i/fps;await seekBg(t);
  M.c.setTransform(k,0,0,k,0,0);drawAt(M.c,t,W,H,segs,total);M.c.setTransform(1,0,0,1,0,0);
  for(const o of outs){if(o!==M)o.c.drawImage(M.cv,0,0,o.w,o.h);
   const vf=new VideoFrame(o.cv,{timestamp:Math.round(i*1e6/fps)});o.ve.encode(vf,{keyFrame:i%90==0});vf.close();
   while(o.ve.encodeQueueSize>8)await sleep(1)}
  if(err)throw err;
  if(i%6==0){pg(0.5+0.5*i/N);msg(`ترميز الفيديو… ${Math.round(100*i/N)}%`);await yld()}}
 for(const o of outs){await o.ve.flush();o.ve.close();if(err)throw err;o.mx.finalize()}
 return outs.slice().reverse().map(o=>{const b=new Blob([o.mx.target.buffer],{type:"video/mp4"});return{q:o.q,label:o.q+"p",blob:b,url:URL.createObjectURL(b),mime:"video/mp4",ext:"mp4"}})}
async function recordLive(P){
 const{W,H,segs,total,bufs,ac,msg,pg}=P;msg("جارٍ التسجيل المباشر…");await ac.resume();
 const dest=ac.createMediaStreamDestination(),qs=[...S.qs].sort((a,b)=>b-a);
 const cvs=qs.map(q=>{const[w,hh]=dims(q,S.fmt),cv=document.createElement("canvas");cv.width=w;cv.height=hh;return{q,cv,c:cv.getContext("2d"),w,h:hh}});
 const M=cvs[0],k=M.q/720;
 const draw=t=>{M.c.setTransform(k,0,0,k,0,0);drawAt(M.c,t,W,H,segs,total);M.c.setTransform(1,0,0,1,0,0);cvs.slice(1).forEach(o=>o.c.drawImage(M.cv,0,0,o.w,o.h))};
 PREV=[];draw(0);
 const mt=["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp8,opus","video/webm"].find(x=>MediaRecorder.isTypeSupported(x));
 if(!mt)throw new Error("هذا الجهاز لا يدعم تسجيل الفيديو");
 const ext=mt.startsWith("video/mp4")?"mp4":"webm",typ=mt.split(";")[0];
 cvs.forEach(o=>{const st=o.cv.captureStream(30);dest.stream.getAudioTracks().forEach(x=>st.addTrack(x));o.ch=[];o.mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:QS.find(z=>z[0]==o.q)[2]});o.mr.ondataavailable=e=>e.data.size&&o.ch.push(e.data);o.done=new Promise(r=>o.mr.onstop=r)});
 if(BGM&&BGM.vid&&S.bgType==3){try{BGM.el.currentTime=0;await BGM.el.play()}catch(e){}}
 const t0=ac.currentTime+0.1;cvs.forEach(o=>o.mr.start(500));
 segs.forEach(s=>{if(s.intro)return;const n=ac.createBufferSource();n.buffer=bufs[s.b];n.connect(dest);n.connect(ac.destination);n.start(t0+s.s)});
 await new Promise(res=>{(function tick(){const x=ac.currentTime-t0;draw(Math.max(0,x));pg(.5+Math.min(.5,x/total/2));if(x>=total)res();else requestAnimationFrame(tick)})()});
 cvs.forEach(o=>o.mr.stop());await Promise.all(cvs.map(o=>o.done));
 return cvs.slice().reverse().map(o=>{const b=new Blob(o.ch,{type:typ});return{q:o.q,label:o.q+"p",blob:b,url:URL.createObjectURL(b),mime:typ,ext}})}
const MEM=new Map(),IDB={db:null,async open(){if(this.db)return this.db;return this.db=await new Promise((res,rej)=>{const r=indexedDB.open("hasanah",1);r.onupgradeneeded=()=>r.result.createObjectStore("a");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(k){try{const d=await this.open();return await new Promise(res=>{const q=d.transaction("a").objectStore("a").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}},
 async put(k,v){try{const d=await this.open();d.transaction("a","readwrite").objectStore("a").put(v,k)}catch(e){}}};
async function getAudio(rec,num){const k=`a:${rec}:${num}`;let ab=MEM.get(k)||await IDB.get(k);
 if(!ab){let urls=[];if(rec==="yd.yasser"){let left=num,surah=1;while(surah<=114&&left>SUR[surah-1].n){left-=SUR[surah-1].n;surah++}if(surah>114)throw new Error("رقم الآية غير صالح");const pad=n=>String(n).padStart(3,"0");urls=[`https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/${pad(surah)}${pad(left)}.mp3`]}else urls=[`https://cdn.islamic.network/quran/audio/128/${rec}/${num}.mp3`,`https://cdn.islamic.network/quran/audio/64/${rec}/${num}.mp3`];let r=null;for(const u of urls){r=await fetchSafe(u);if(r.ok)break}if(!r||!r.ok)throw new Error("تعذر تحميل تلاوة القارئ المختار ("+(r?.status||"شبكة")+")");ab=await r.arrayBuffer();IDB.put(k,ab.slice(0))}
 MEM.set(k,ab.slice(0));while(MEM.size>12)MEM.delete(MEM.keys().next().value);return ab}
async function cj(url){const k="j:"+url,c=LS.get(k);if(c)return c;const j=await(await fetchSafe(url)).json();LS.set(k,j);return j}
async function gen(){
 if(S.run)return;S.err=null;S.note=null;S.run=true;render();const msg=t=>{const m=$("msg");if(m)m.textContent=t},pg=v=>{const p=$("pg");if(p)p.value=v};
 let ac=null;
 try{
  const[W,H]=dims(720,S.fmt);
  if(S.bgType==2&&!PH.el){msg("تحميل الصورة…");await loadPhoto(S.photo)}
  msg("تحميل نص الآيات…");
  const[j,k]=await Promise.all([cj(`https://api.alquran.cloud/v1/surah/${S.surah}/${TXTID[S.txt]}`),S.tr?cj(`https://api.alquran.cloud/v1/surah/${S.surah}/${S.tr}`):null]);
  const ay=j.data.ayahs.filter(x=>x.numberInSurah>=S.from&&x.numberInSurah<=S.to),trm={};
  if(k)k.data.ayahs.forEach(x=>trm[x.numberInSurah]=x.text);
  msg("تحميل الخط…");await loadFont(ay.map(a=>a.text).join(" ").slice(0,600));
  ac=new(window.AudioContext||window.webkitAudioContext)();
  let done=0;msg(`تحميل التلاوة 0 / ${ay.length}…`);
  const bufs=new Array(ay.length);let cursor=0;const workers=Array.from({length:Math.min(2,ay.length)},async()=>{while(true){const i=cursor++;if(i>=ay.length)return;const a=ay[i],raw=await getAudio(S.rec,a.number);bufs[i]=await ac.decodeAudioData(raw.slice(0));done++;msg(`تحميل التلاوة ${done} / ${ay.length}…`);pg(done/ay.length/2)}});await Promise.all(workers);
  const segs=[];let t=0.6;if(S.intro){segs.push({intro:true,s:0.4,e:2.8});t=3.2}
  ay.forEach((a,i)=>{const tx=cleanAyah(a);for(let n=0;n<S.rep;n++){segs.push({s:t,e:t+bufs[i].duration,t:tx,n:a.numberInSurah,tr:trm[a.numberInSurah]||"",b:i});t+=bufs[i].duration+S.gap}});
  const total=t+0.2,mix=buildMix(segs,bufs,ac.sampleRate,total);AUD={L:mix.L,sr:ac.sampleRate};
  const P={W,H,segs,total,bufs,ac,mix,msg,pg};
  let outs=null;
  if(window.VideoEncoder&&window.AudioEncoder&&window.VideoFrame&&window.AudioData){try{outs=await encodeOffline(P)}catch(e){S.note="تعذّر الترميز السريع ("+((e&&e.message)||e)+") فاستُخدم التسجيل المباشر."}}
  if(!outs)outs=await recordLive(P);
  S.outs=outs;S.cur=outs.length-1;
 }catch(e){S.err=String((e&&e.message)||e)}
 AUD=null;try{ac&&ac.close()}catch(e){}
 S.run=false;render()}
function previewKey(){return `preview:${S.surah}:${S.from}:${S.to}:${S.cur}`}
function storePreview(v){if(v&&Number.isFinite(v.currentTime))LS.set(previewKey(),v.currentTime)}
function restorePreview(v){const t=LS.get(previewKey());if(Number.isFinite(t)&&t>0&&t<(v.duration||0))v.currentTime=t}
async function saveVid(i){const x=S.outs[i],fn=`hasanah-${S.surah}-${S.from}-${S.to}-${x.label}-${Date.now()%100000}.${x.ext}`,set=t=>{const e=$("sp"+i);if(e)e.textContent=t};
 if(window.Android){if(Android.start(fn,x.mime)===false){set(" · تعذر بدء الحفظ");return}const B=x.blob,K=3145728;
  for(let o=0;o<B.size;o+=K){const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(B.slice(o,o+K))});Android.chunk(d);set(" · "+Math.round(100*Math.min(B.size,o+K)/B.size)+"%")}
  Android.end();set(" · ✓ تم الحفظ")}
 else{const a=document.createElement("a");a.href=x.url;a.download=fn;a.click();set(" · ✓")}}
async function saveAll(){for(let i=0;i<S.outs.length;i++)await saveVid(i)}
async function shareVid(i){if(window.Android){await saveVid(i);Android.share()}else saveVid(i)}
try{const th=LS.get("theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark");setTheme(th)}catch(e){setTheme("dark")}
loadFont();render();refreshRecs();try{if(window.Android&&Android.restoreBackground)Android.restoreBackground()}catch(e){}
