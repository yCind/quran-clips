<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسنة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Lateef&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Harmattan:wght@400;700&display=swap">
<style>
:root{--bg:#14171f;--panel:#1c212c;--ink:#efe6d2;--dim:#9aa3b2;--acc:#7fb2a0;--line:#2b3242}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic","Droid Arabic Naskh",serif;font-size:18px}
header{padding:12px 14px;border-bottom:1px solid var(--line)}
.brand{color:var(--acc);font-size:15px}
.dots{display:flex;gap:6px;margin-top:8px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--acc)}
h2{margin:0;font-size:20px}main{padding:14px 14px 100px}
label{display:block;color:var(--dim);margin:14px 0 6px}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.row{display:flex;gap:10px;align-items:center}.opt{display:block;width:100%;text-align:start;margin-bottom:8px}.opt.sel{border-color:var(--acc);background:#22332d}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw button{height:46px;padding:0;border:2px solid var(--line);font-size:13px}.sw button.sel{border-color:var(--acc)}
.ck{display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--ink)}.ck input{width:22px;height:22px;accent-color:#7fb2a0}
input[type=color]{width:64px;height:44px;padding:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
footer{position:fixed;bottom:0;inset-inline:0;display:flex;gap:10px;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.pri{background:var(--acc);color:#10231c;border-color:var(--acc)}.note{color:var(--dim);font-size:15px;line-height:1.8}
video{width:100%;max-height:50vh;border-radius:10px;background:#000}progress{width:100%;height:10px}
#pv{display:block;margin:0 auto 6px;max-width:100%;max-height:34vh;border-radius:10px;border:1px solid var(--line)}
.out{display:flex;gap:8px;align-items:center;margin-top:10px}.out span{flex:1;font-size:16px}.out button{width:auto;padding:8px 14px}
</style></head><body>
<header><div class="brand">حسنة</div><h2 id="ttl"></h2><div class="dots" id="dots"></div></header>
<main id="out"></main><footer id="ft"></footer>
<input type="file" id="bgf" accept="image/*,video/*" hidden onchange="pickBg(this)">
<script>
const $=id=>document.getElementById(id);
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const REC=[["ar.alafasy","مشاري العفاسي"],["ar.husary","محمود خليل الحصري"],["ar.minshawi","محمد صديق المنشاوي"],["ar.abdulbasitmurattal","عبد الباسط عبد الصمد"],["ar.mahermuaiqly","ماهر المعيقلي"],["ar.hudhaify","علي الحذيفي"],["ar.shaatree","أبو بكر الشاطري"],["ar.ahmedajamy","أحمد العجمي"],["ar.muhammadayyoub","محمد أيوب"]];
const BG=[["ليل",["#14171f","#27344a"]],["فجر",["#2a1f2d","#7a4a52"]],["واحة",["#0e211a","#2a5a47"]],["رمل",["#2b2418","#6b5a34"]],["بحر",["#0d1b2a","#1b4965"]],["غروب",["#2b1b17","#b5651d"]],["بنفسجي",["#1d1530","#4b3a7a"]],["أسود",["#000000","#101010"]]];
const FM=[[9,16,"عمودي 9:16 (ستوري)"],[1,1,"مربع 1:1"],[16,9,"أفقي 16:9"],[4,5,"عمودي 4:5 (إنستغرام)"]];
const FONTS=[["Amiri Quran","أميري قرآن (الأفضل للتشكيل)"],["Scheherazade New","شهرزاد (تشكيل ممتاز)"],["Amiri","أميري"],["Noto Naskh Arabic","نسخ"],["Lateef","لطيف"],["Aref Ruqaa","عارف رقعة"],["Reem Kufi","ريم كوفي"],["Cairo","القاهرة"],["Tajawal","تجوّل"],["Harmattan","هرمتان"]];
const PAL=["#efe6d2","#ffffff","#e6c36a","#9ad7b8","#8fd3f4","#f4b8c8","#f2a65a","#111111"];
const META=[["rgba(239,230,210,.75)","كريمي خافت"],["#e6c36a","ذهبي"],["#ffffff","أبيض"],["#aab3c2","رمادي"]];
const SZ=[[64,"كبير"],[50,"متوسط"],[38,"صغير"]];
const DIM=[[0,"بدون"],[30,"خفيف"],[50,"متوسط"],[70,"قوي"]];
const TXT=[["quran-uthmani","الرسم العثماني (تشكيل المصحف)"],["quran-simple","الرسم الإملائي (تشكيل مبسّط)"],["quran-simple-clean","بدون تشكيل"]];
const TRS=[["","بدون ترجمة"],["ar.muyassar","التفسير الميسر (عربي)"],["en.sahih","الإنجليزية (Sahih)"],["fr.hamidullah","الفرنسية (Hamidullah)"]];
const QS=[[480,"480p (خفيف)",1200000],[720,"720p (متوسط)",2500000],[1080,"1080p (عالٍ)",5000000]];
const S=Object.assign({surah:1,from:1,to:1,rec:"ar.alafasy",bg:0,fmt:0,tr:"",rep:1,col:"#efe6d2",mcol:0,sz:0,font:0,dim:30,txt:0,showS:true,showR:true,showN:true,qs:[720]},LS.get("s2")||{},{step:0,run:false,outs:null,err:null});
let SUR=LS.get("sur"),MAX=15,BGM=null;
const T=["اختيار السورة","اختيار الآيات","اختيار القارئ","الخلفية والقياس","الخط والنص","الجودة والإنشاء"];
const cnt=()=>SUR?SUR[S.surah-1].n:1;
async function surahs(){if(SUR)return;try{const j=await(await fetch("https://api.alquran.cloud/v1/surah")).json();SUR=j.data.map(x=>({a:x.name.replace("سُورَةُ ","").replace("سورة ",""),n:x.numberOfAyahs}));LS.set("sur",SUR)}catch(e){}}
function save(){const{step,run,outs,err,...r}=S;LS.set("s2",r)}
const nav=(l,r)=>{$("ft").innerHTML=l+r};
const opt=(a,v,k)=>a.map((x,i)=>{const val=k?x[0]:i;return `<option value="${val}" ${val==v?"selected":""}>${x[1]}</option>`}).join("");
const dims=(q,fm)=>{const[a,b]=FM[fm],e=n=>Math.round(n/2)*2;return a>=b?[e(q*a/b),q]:[q,e(q*b/a)]};
function pickBg(inp){const f=inp.files&&inp.files[0];if(!f)return;const u=URL.createObjectURL(f);
 if(BGM&&BGM.url)URL.revokeObjectURL(BGM.url);
 if(f.type.startsWith("video")){const v=document.createElement("video");v.muted=true;v.loop=true;v.playsInline=true;v.src=u;v.style.cssText="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none";document.body.appendChild(v);v.play().catch(()=>{});BGM={el:v,url:u,name:f.name,vid:true}}
 else{const im=new Image();im.onload=()=>{render()};im.src=u;BGM={el:im,url:u,name:f.name}}
 inp.value="";render()}
function rmBg(){if(BGM){if(BGM.vid)BGM.el.remove();URL.revokeObjectURL(BGM.url)}BGM=null;render()}
function render(){
 $("ttl").textContent=`الخطوة ${S.step+1} من 6: ${T[S.step]}`;
 $("dots").innerHTML=T.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("");
 const back=S.step>0&&!S.run?`<button onclick="go(-1)">السابق</button>`:"";
 const next=S.step<5?`<button class="pri" onclick="go(1)">التالي</button>`:"";
 const o=$("out");
 if(S.step==0){
  if(!SUR){o.innerHTML='<p class="note">جارٍ تحميل قائمة السور…</p>';surahs().then(()=>{SUR?render():o.innerHTML='<p class="note">تعذّر تحميل القائمة. تحقق من الاتصال ثم أعد فتح التطبيق.</p>'});nav("","");return}
  o.innerHTML=`<label>السورة</label><select onchange="S.surah=+this.value;S.from=1;S.to=Math.min(cnt(),MAX)">${SUR.map((x,i)=>`<option value="${i+1}" ${i+1==S.surah?"selected":""}>${i+1}. ${x.a} (${x.n} آية)</option>`).join("")}</select>`;nav("",next)}
 if(S.step==1){
  if(S.to>cnt())S.to=cnt();if(S.from>S.to)S.from=S.to;
  o.innerHTML=`<div class="row"><div style="flex:1"><label>من الآية</label><input type="number" min="1" max="${cnt()}" value="${S.from}" onchange="S.from=Math.max(1,Math.min(cnt(),+this.value||1));if(S.to<S.from)S.to=S.from;if(S.to-S.from+1>MAX)S.to=S.from+MAX-1;render()"></div>
  <div style="flex:1"><label>إلى الآية</label><input type="number" min="1" max="${cnt()}" value="${S.to}" onchange="S.to=Math.max(S.from,Math.min(cnt(),+this.value||S.from));if(S.to-S.from+1>MAX)S.to=S.from+MAX-1;render()"></div></div>
  <label>تكرار كل آية (للحفظ)</label><select onchange="S.rep=+this.value">${[1,2,3,5].map(n=>`<option value="${n}" ${n==S.rep?"selected":""}>${n==1?"بدون تكرار":n+" مرات"}</option>`).join("")}</select>
  <p class="note">سورة ${SUR[S.surah-1].a}. عدد الآيات المختارة: ${S.to-S.from+1} (الحد الأقصى ${MAX} آية).</p>`;nav(back,next)}
 if(S.step==2){o.innerHTML=REC.map(r=>`<button class="opt ${r[0]==S.rec?"sel":""}" onclick="S.rec='${r[0]}';render()">${r[1]}</button>`).join("");nav(back,next)}
 if(S.step==3){
  o.innerHTML=`<canvas id="pv"></canvas>
  <label>خلفية من معرضك (صورة أو فيديو)</label>
  <div class="row"><button class="pri" onclick="$('bgf').click()">${BGM?"تغيير الملف":"اختيار صورة أو فيديو"}</button>${BGM?`<button onclick="rmBg()" style="width:auto">إزالة</button>`:""}</div>
  ${BGM?`<p class="note">${BGM.vid?"فيديو":"صورة"}: ${BGM.name}</p><label>تعتيم الخلفية (لوضوح الخط)</label><select onchange="S.dim=+this.value;render()">${opt(DIM,S.dim,true)}</select>`:`<label>أو اختر لونًا</label><div class="sw">${BG.map((b,i)=>`<button class="${i==S.bg?"sel":""}" style="background:linear-gradient(160deg,${b[1][0]},${b[1][1]})" onclick="S.bg=${i};render()">${b[0]}</button>`).join("")}</div>`}
  <label>قياس الفيديو</label><select onchange="S.fmt=+this.value;render()">${opt(FM,S.fmt)}</select>`;
  drawPv();nav(back,next)}
 if(S.step==4){
  o.innerHTML=`<canvas id="pv"></canvas>
  <label>الخط العربي</label><select onchange="S.font=+this.value;render()">${opt(FONTS,S.font)}</select>
  <label>نص الآيات والتشكيل</label><select onchange="S.txt=+this.value">${opt(TXT,S.txt)}</select>
  <label>حجم الخط</label><select onchange="S.sz=+this.value;render()">${opt(SZ,S.sz)}</select>
  <label>لون الآية</label><div class="row"><div class="sw" style="flex:1">${PAL.map(c=>`<button class="${c==S.col?"sel":""}" style="background:${c}" onclick="S.col='${c}';render()"></button>`).join("")}</div><input type="color" value="${S.col}" onchange="S.col=this.value;render()"></div>
  <label>لون الاسم والترجمة</label><select onchange="S.mcol=+this.value;render()">${opt(META,S.mcol)}</select>
  <label>الترجمة أو التفسير</label><select onchange="S.tr=this.value;render()">${opt(TRS,S.tr,true)}</select>
  <label class="ck"><input type="checkbox" ${S.showS?"checked":""} onchange="S.showS=this.checked;render()">إظهار اسم السورة</label>
  <label class="ck"><input type="checkbox" ${S.showR?"checked":""} onchange="S.showR=this.checked;render()">إظهار اسم القارئ</label>
  <label class="ck"><input type="checkbox" ${S.showN?"checked":""} onchange="S.showN=this.checked;render()">إظهار رقم الآية</label>
  <p class="note">الخطوط تُحمَّل من الإنترنت عند أول استخدام. للتشكيل الصحيح اختر أميري قرآن أو شهرزاد.</p>`;
  drawPv();nav(back,next)}
 if(S.step==5){
  if(S.outs){const b=S.outs[S.outs.length-1];o.innerHTML=`<video src="${b.url}" controls playsinline></video>`+S.outs.map((x,i)=>`<div class="out"><span>${x.label} · ${(x.blob.size/1048576).toFixed(1)} MB</span><button class="pri" onclick="saveVid(${i})">حفظ</button><button onclick="shareVid(${i})">مشاركة</button></div>`).join("");
   nav(`<button onclick="again()">مقطع جديد</button>`,"");return}
  if(S.run){o.innerHTML=`<p class="note" id="msg">جارٍ التجهيز…</p><progress id="pg" max="1" value="0"></progress><p class="note">لا تغلق التطبيق حتى ينتهي. يُسجَّل المقطع بالزمن الحقيقي لطول التلاوة.</p>`;nav("","");return}
  o.innerHTML=(S.err?`<p class="note" style="color:#e8a08f">تعذّر إنشاء المقطع. السبب: ${S.err}</p>`:"")+
  `<label>جودات التصدير (يمكن اختيار أكثر من واحدة)</label>`+QS.map(q=>`<label class="ck"><input type="checkbox" ${S.qs.includes(q[0])?"checked":""} onchange="tq(${q[0]},this.checked)">${q[1]}</label>`).join("")+
  `<p class="note">سورة ${SUR[S.surah-1].a}، الآيات ${S.from} إلى ${S.to}${S.rep>1?` (كل آية ${S.rep} مرات)`:""}<br>القارئ: ${REC.find(r=>r[0]==S.rec)[1]}<br>${BGM?"خلفية: "+(BGM.vid?"فيديو":"صورة"):"خلفية: "+BG[S.bg][0]} · ${FM[S.fmt][2]}<br>الخط: ${FONTS[S.font][1]}</p>
  <p class="note">الجودة العالية (1080p) تحتاج هاتفًا قويًا، وإن تقطّع التسجيل فاختر 720p أو أقل.</p>`;
  nav(back,`<button class="pri" onclick="gen()">ابدأ الإنشاء</button>`)}
 save()}
function tq(q,on){S.qs=on?[...new Set([...S.qs,q])].sort((a,b)=>a-b):S.qs.filter(x=>x!=q);if(!S.qs.length)S.qs=[720];save()}
function go(d){S.step+=d;render();scrollTo(0,0)}
function again(){(S.outs||[]).forEach(x=>URL.revokeObjectURL(x.url));S.outs=null;S.step=0;render()}
window.goBack=()=>{if(S.run)return true;if(S.step>0){if(S.step==5&&S.outs){again();return true}go(-1);return true}return false};
function wrap(c,t,w){const ws=t.split(" "),L=[];let l="";for(const x of ws){const y=l?l+" "+x:x;if(c.measureText(y).width>w&&l){L.push(l);l=x}else l=y}if(l)L.push(l);return L}
const FF=()=>`"${FONTS[S.font][0]}","Amiri Quran","Amiri","Noto Naskh Arabic",serif`;
function cover(c,el,W,H){const iw=el.videoWidth||el.naturalWidth,ih=el.videoHeight||el.naturalHeight;if(!iw||!ih)return false;const k=Math.max(W/iw,H/ih),w=iw*k,h=ih*k;c.drawImage(el,(W-w)/2,(H-h)/2,w,h);return true}
function frame(c,seg,W,H){
 let media=false;
 if(BGM){media=cover(c,BGM.el,W,H);if(media&&S.dim){c.fillStyle=`rgba(0,0,0,${S.dim/100})`;c.fillRect(0,0,W,H)}}
 if(!media){const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,BG[S.bg][1][0]);g.addColorStop(1,BG[S.bg][1][1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  c.strokeStyle="rgba(239,230,210,.3)";c.lineWidth=2;c.strokeRect(28,28,W-56,H-56)}
 try{c.textRendering="optimizeLegibility";c.fontKerning="normal";c.lang="ar"}catch(e){}
 if(media){c.shadowColor="rgba(0,0,0,.65)";c.shadowBlur=10}else c.shadowBlur=0;
 c.textAlign="center";c.textBaseline="middle";c.direction="rtl";
 const mcol=META[S.mcol][0];
 if(S.showS){c.font=`44px ${FF()}`;c.fillStyle=mcol;c.fillText("سورة "+(SUR?SUR[S.surah-1].a:"الفاتحة"),W/2,H*0.075+10)}
 if(!seg){c.shadowBlur=0;return}
 const pad=Math.round(H*0.14),mw=W-150,avail=H-2*pad,hasTr=!!seg.tr;
 let fs=SZ[S.sz][0],L;for(;fs>=22;fs-=2){c.font=`${fs}px ${FF()}`;L=wrap(c,seg.t,mw);if(L.length*fs*2<=avail*(hasTr?0.6:1))break}
 const lh=fs*2,ah=L.length*lh;
 let ft=Math.min(34,Math.round(H*0.03)),TL=[],trl=false;
 if(hasTr){trl=/^ar/.test(S.tr);c.direction=trl?"rtl":"ltr";for(ft=Math.max(22,ft);ft>=16;ft-=2){c.font=`${ft}px sans-serif`;TL=wrap(c,seg.tr,mw);if(TL.length*ft*1.6<=avail-ah-30)break}}
 const th=hasTr?TL.length*ft*1.6+30:0,y0=H/2-(ah+th)/2;
 c.direction="rtl";c.font=`${fs}px ${FF()}`;c.fillStyle=S.col;
 L.forEach((x,i)=>c.fillText(x,W/2,y0+i*lh+lh/2));
 if(hasTr){c.direction=trl?"rtl":"ltr";c.font=`${ft}px sans-serif`;c.fillStyle=mcol;TL.forEach((x,i)=>c.fillText(x,W/2,y0+ah+30+i*ft*1.6+ft*0.8))}
 c.direction="rtl";c.font=`28px ${FF()}`;c.fillStyle=mcol;
 const bl=[];if(S.showN)bl.push("الآية "+seg.n);if(S.showR)bl.push(REC.find(r=>r[0]==S.rec)[1]);
 bl.forEach((x,i)=>c.fillText(x,W/2,H-pad*0.55+(i-(bl.length-1)/2)*40));
 c.shadowBlur=0}
const SAMPLE="بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ";
async function loadFont(txt){try{await document.fonts.load(`40px "${FONTS[S.font][0]}"`,txt||SAMPLE);await document.fonts.load(`40px "Amiri Quran"`,SAMPLE)}catch(e){}}
async function drawPv(){const cv=$("pv");if(!cv)return;const[W,H]=dims(720,S.fmt);cv.width=W;cv.height=H;
 await loadFont();if(!$("pv"))return;
 frame(cv.getContext("2d"),{t:SAMPLE,n:1,tr:S.tr?(S.tr=="ar.muyassar"?"هنا يظهر التفسير تحت الآية":S.tr=="en.sahih"?"Translation appears here":"La traduction apparaît ici"):""},W,H)}
const norm=s=>s.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"");
function cleanAyah(a){let w=a.text.split(" ");if(S.surah!=1&&a.numberInSurah==1&&w.length>4&&norm(w[0])=="بسم")w=w.slice(4);return w.join(" ")}
async function gen(){
 if(!window.MediaRecorder){S.err="هذا الجهاز لا يدعم تسجيل الفيديو";render();return}
 S.err=null;S.run=true;render();const msg=t=>{const m=$("msg");if(m)m.textContent=t},pg=v=>{const p=$("pg");if(p)p.value=v};
 let ac=null;
 try{
  const[W,H]=dims(720,S.fmt);
  msg("تحميل نص الآيات…");
  const j=await(await fetch(`https://api.alquran.cloud/v1/surah/${S.surah}/${TXT[S.txt][0]}`)).json();
  const ay=j.data.ayahs.filter(x=>x.numberInSurah>=S.from&&x.numberInSurah<=S.to);
  let trm={};if(S.tr){msg("تحميل الترجمة…");const k=await(await fetch(`https://api.alquran.cloud/v1/surah/${S.surah}/${S.tr}`)).json();k.data.ayahs.forEach(x=>trm[x.numberInSurah]=x.text)}
  msg("تحميل الخط…");await loadFont(ay.map(a=>a.text).join(" ").slice(0,600));
  ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();
  const bufs=[];
  for(let i=0;i<ay.length;i++){msg(`تحميل تلاوة الآية ${i+1} من ${ay.length}…`);pg(i/ay.length/2);
   let r=await fetch(`https://cdn.islamic.network/quran/audio/128/${S.rec}/${ay[i].number}.mp3`);if(!r.ok)r=await fetch(`https://cdn.islamic.network/quran/audio/64/${S.rec}/${ay[i].number}.mp3`);if(!r.ok)throw new Error("تحميل التلاوة فشل ("+r.status+")");
   bufs.push(await ac.decodeAudioData(await r.arrayBuffer()))}
  const dest=ac.createMediaStreamDestination();
  const qs=[...S.qs].sort((a,b)=>b-a),cvs=qs.map(q=>{const[w,h]=dims(q,S.fmt),cv=document.createElement("canvas");cv.width=w;cv.height=h;return{q,cv,c:cv.getContext("2d"),w,h}});
  const M=cvs[0],k=M.q/720;
  const segs=[];let t=0.6;ay.forEach((a,i)=>{const tx=cleanAyah(a);for(let n=0;n<S.rep;n++){segs.push({s:t,e:t+bufs[i].duration,t:tx,n:a.numberInSurah,tr:trm[a.numberInSurah]||"",b:i});t+=bufs[i].duration+0.4}});
  const total=t;
  const draw=sg=>{M.c.setTransform(k,0,0,k,0,0);frame(M.c,sg,W,H);M.c.setTransform(1,0,0,1,0,0);cvs.slice(1).forEach(o=>{o.c.drawImage(M.cv,0,0,o.w,o.h)})};
  draw(null);
  const mt=["video/webm;codecs=vp8,opus","video/webm"].find(x=>MediaRecorder.isTypeSupported(x));
  cvs.forEach(o=>{const st=o.cv.captureStream(30);dest.stream.getAudioTracks().forEach(x=>st.addTrack(x));
   o.ch=[];o.mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:QS.find(z=>z[0]==o.q)[2]});o.mr.ondataavailable=e=>e.data.size&&o.ch.push(e.data);o.done=new Promise(r=>o.mr.onstop=r)});
  if(BGM&&BGM.vid){try{BGM.el.currentTime=0;await BGM.el.play()}catch(e){}}
  const t0=ac.currentTime+0.1;cvs.forEach(o=>o.mr.start(1000));
  segs.forEach(s=>{const n=ac.createBufferSource();n.buffer=bufs[s.b];n.connect(dest);n.connect(ac.destination);n.start(t0+s.s)});
  msg("جارٍ تسجيل المقطع…");
  await new Promise(res=>{(function tick(){const x=ac.currentTime-t0;const sg=segs.find(s=>x>=s.s-0.2&&x<s.e+0.3);draw(sg);pg(.5+Math.min(.5,x/total/2));
   if(x>=total){res()}else requestAnimationFrame(tick)})()});
  cvs.forEach(o=>o.mr.stop());await Promise.all(cvs.map(o=>o.done));
  S.outs=cvs.slice().reverse().map(o=>{const b=new Blob(o.ch,{type:"video/webm"});return{q:o.q,label:o.q+"p",blob:b,url:URL.createObjectURL(b),saved:false}});
 }catch(e){S.err=String((e&&e.message)||e)}
 try{ac&&ac.close()}catch(e){}
 S.run=false;render()}
async function saveVid(i){const x=S.outs[i];
 const fn=`hasanah-${S.surah}-${S.from}-${S.to}-${x.label}-${Date.now()%100000}.webm`;
 if(window.Android){Android.start(fn);const B=x.blob,K=300000;
  for(let o=0;o<B.size;o+=K){const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(B.slice(o,o+K))});Android.chunk(d)}
  Android.end();x.saved=true}
 else{const a=document.createElement("a");a.href=x.url;a.download=fn;a.click()}}
async function shareVid(i){if(window.Android){await saveVid(i);Android.share()}else saveVid(i)}
render();
</script></body></html>
