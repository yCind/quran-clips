<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Clips App</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --primary: #4f46e5; --text-color: #f8fafc; --text-secondary: #94a3b8; --border-color: #334155; --accent: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 16px; }
        .section { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-secondary); }
        .btn { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; text-align: center; border-radius: 10px; cursor: pointer; font-weight: 600; border: none; margin-bottom: 10px; }
        .btn-success { background: var(--accent); }
        input[type="file"] { display: none; }
        .preview-box { width: 100%; height: 200px; background: #000; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--border-color); margin-bottom: 12px; overflow: hidden; }
        .preview-box video, .preview-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        canvas { position: absolute; bottom: 0; width: 100%; height: 50px; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>معدل مقاطع القرآن الذكي</h1>
        <div class="preview-box">
            <span id="ph" style="color:#94a3b8; font-size:0.85rem; z-index:2;">اختر خلفية صورة أو فيديو</span>
            <video id="vPrev" controls style="display:none;"></video>
            <img id="iPrev" style="display:none;">
            <canvas id="cPrev"></canvas>
        </div>
        <label class="btn">📁 تحميل خلفية <input type="file" id="bgIn" accept="image/*,video/*"></label>
        <button class="btn" id="audBtn" style="background: #2563eb;">🎵 شكل الموجة الصوتية</button>
        <button class="btn btn-success" id="procBtn">⚡ معالجة وتنزيل</button>
    </div>
    <script>
        const bgIn = document.getElementById("bgIn"), vPrev = document.getElementById("vPrev"), iPrev = document.getElementById("iPrev"), ph = document.getElementById("ph");
        bgIn.onchange = e => {
            let f = e.target.files[0]; if(!f) return;
            let url = URL.createObjectURL(f); ph.style.display = "none";
            if(f.type.startsWith("video/")) { iPrev.style.display="none"; vPrev.style.display="block"; vPrev.src=url; }
            else { vPrev.style.display="none"; iPrev.style.display="block"; iPrev.src=url; }
        };
        document.getElementById("procBtn").onclick = () => alert("تمت المعالجة بنجاح!");
    </script>
</body>
</html>update-app
